<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ClawBrief</title>
  <style>
    body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; margin: 20px auto; max-width: 980px; padding: 0 14px 24px; color: #1f2937; background:#fff; }
    h1 { margin: 0 0 6px; font-size: 28px; }
    .muted { color:#6b7280; margin:0 0 14px; }
    .layout { display:grid; grid-template-columns: 250px 1fr; gap: 14px; align-items:start; }
    .panel { border:1px solid #e5e7eb; border-radius: 12px; padding: 12px; background:#fff; }
    ul { margin: 8px 0 0; padding-left: 18px; }
    a { color: #2563eb; text-decoration: none; }
    a:hover { text-decoration: underline; }
    #content img { max-width: 100%; height: auto; border-radius: 10px; border:1px solid #e5e7eb; }
    #content table { width:100%; border-collapse: collapse; font-size:14px; display:block; overflow-x:auto; }
    #content th,#content td { border:1px solid #e5e7eb; padding:8px; text-align:left; white-space:nowrap; }
    #content th { background:#f8fafc; }
    @media (max-width: 800px) {
      body { margin: 12px auto; padding: 0 10px 18px; }
      h1 { font-size: 24px; }
      .layout { grid-template-columns: 1fr; gap: 10px; }
      .panel { padding: 10px; }
      #content { font-size: 15px; line-height: 1.6; }
    }
  </style>
</head>
<body>
  <h1>ClawBrief 🐾</h1>
  <p class="muted">Daily at 09:00 UTC · Markdown as source of truth</p>

  <div class="layout">
    <aside class="panel">
      <strong>Entries</strong>
      <ul id="list"></ul>
    </aside>
    <main class="panel">
      <article id="content">Loading…</article>
    </main>
  </div>

  <script type="module">

    const entries = [
      '2026-07-09-ai-opportunity.md',

      '2026-07-06-ai-opportunity.md',
      '2026-07-05-ai-opportunity.md',
      '2026-07-04-ai-opportunity.md',
      '2026-07-03-ai-opportunity.md',

      '2026-06-30-ai-opportunity.md',

      '2026-05-07-ai-opportunity.md',
      '2026-05-07.md'
    ];

    const listEl = document.getElementById('list');
    const contentEl = document.getElementById('content');

    function qs(name) {
      const u = new URL(window.location.href);
      return u.searchParams.get(name);
    }

    async function render(file) {
      const res = await fetch(`./data/${file}`);
      if (!res.ok) {
        contentEl.innerHTML = `<p>Failed to load: ${file}</p>`;
        return;
      }
      const md = await res.text();
      contentEl.innerHTML = marked.parse(md);
    }

    entries.forEach(file => {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = `?d=${encodeURIComponent(file)}`;
      a.textContent = file.replace('.md','');
      li.appendChild(a);
      listEl.appendChild(li);
    });

    const selected = qs('d');
    const target = entries.includes(selected) ? selected : entries[0];
    render(target);
  </script>
</body>
</html>
