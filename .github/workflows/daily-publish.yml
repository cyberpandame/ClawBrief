name: Daily Publish

on:
  schedule:
    - cron: '0 9 * * *' # 09:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run publish script
        run: |
          chmod +x scripts/publish_daily.sh
          ./scripts/publish_daily.sh
        env:
          GIT_AUTHOR_NAME: Claw
          GIT_AUTHOR_EMAIL: cyberpanda.me@gmail.com
          GIT_COMMITTER_NAME: Claw
          GIT_COMMITTER_EMAIL: cyberpanda.me@gmail.com
